[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inbox-triage-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<0.140",
    "uvicorn[standard]>=0.51,<0.52",
    "anthropic>=0.116,<0.117",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.18,<1.19",
    "pgvector>=0.5,<0.6",
    "redis[hiredis]>=8.0,<9.0",
    # Bolt 1.30+ dropped the unused ``[async]`` extra; install aiohttp explicitly
    # (required by ``slack_bolt.async_app.AsyncApp`` per Slack Bolt docs).
    "slack-bolt>=1.29,<2.0",
    "aiohttp>=3.9,<4",
    "httpx>=0.28,<0.29",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "structlog>=26.1,<27.0",
    "python-dotenv>=1.2,<2.0",
    "pyyaml>=6.0,<7.0",
    "apscheduler>=3.11,<4.0",
    "msal>=1.37,<2.0",
    "cryptography>=44,<50",
    "openai>=1.0,<3.0",
    "argon2-cffi>=25.1.0",
    "pyjwt[crypto]>=2.13.0",
    "slowapi>=0.1.10",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.15,<0.16",
    "mypy>=2.2,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = import sorting, UP = pyupgrade,
# B = bugbear (real-bug patterns), ASYNC = async correctness (critical here),
# C4 = comprehensions, SIM = simplifications.
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Alembic env/versions are framework-generated and loosely typed; don't gate on them.
exclude = ["^app/db/migrations/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Third-party packages that ship no type stubs. Scoped narrowly so our own
# code is still fully type-checked.
[[tool.mypy.overrides]]
module = [
    "msal.*",
    "slack_bolt.*",
    "slack_sdk.*",
    "pgvector.*",
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live_graph: opt-in live Microsoft Graph tests (set RUN_LIVE_GRAPH=1)",
    "live_claude: opt-in live Anthropic Haiku triage tests (set RUN_LIVE_CLAUDE=1)",
    "live_e2e: opt-in live Graph→Redis→DB→PII→Haiku pipeline (set RUN_LIVE_E2E=1)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
