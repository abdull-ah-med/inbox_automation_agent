# Production overlay (EC2 or similar).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Put secrets in backend/.env.prod (gitignored). Outside ENVIRONMENT=local the
# app requires TLS Redis (rediss:// + password), non-localhost DATABASE_URL,
# HTTPS FRONTEND_ORIGIN, JWT_SECRET (>=64), Graph/Slack/MSAL keys, etc.

services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    volumes: !reset []
    ports:
      - "8000:8000"
