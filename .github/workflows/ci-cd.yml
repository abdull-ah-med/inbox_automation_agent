name: CI/CD

on:
  push:
    branches: [feat/web-dashboard, dev]
  pull_request:
    branches: [feat/web-dashboard, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  backend-ci:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inbox_triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inbox_triage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # Pin full commit SHAs (Semgrep: github-actions-mutable-action-tag).
      # https://sg.run/2LgAL
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -e .[dev]

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: ABC + LOC budgets
        working-directory: .
        run: python3 misc/scripts/check_abc_budgets.py --backend

      - name: Pytest
        env:
          ENVIRONMENT: local
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/inbox_triage_test
        run: pytest

  semgrep:
    # Semgrep Community Edition — sample shape from
    # https://docs.semgrep.dev/semgrep-ci/sample-ci-configs (Semgrep CE).
    # Packs + --error match scripts/semgrep-scan.sh for local parity.
    name: Semgrep CE
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/fastapi \
            --config p/javascript \
            --config p/react \
            --config p/typescript \
            --error \
            --metrics=off

  frontend-ci:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run fmt:check

      - name: ABC + LOC budgets
        run: npm run lint:budgets

      - name: React Doctor
        run: npm run doctor -- --blocking none

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://placeholder.invalid

  deploy:
    name: Deploy to EC2 (via SSM)
    needs: [backend-ci, frontend-ci, semgrep]
    if: vars.ENABLE_DEPLOYMENT == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command over SSM
        env:
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # Pin EC2 checkout to the commit this workflow already verified.
          # https://docs.github.com/en/actions/learn-github-actions/variables
          {
            echo "export DEPLOY_SHA='${GITHUB_SHA}'"
            echo "export BRANCH='dev'"
            cat deploy/ssm-deploy.sh
          } > /tmp/ssm-deploy-pinned.sh

          # One JSON string, not split("\n"): a line-split array would
          # execute the script's #!/bin/bash as its own RunShellScript command.
          COMMANDS_JSON=$(bash deploy/ssm-commands-json.sh /tmp/ssm-deploy-pinned.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy inbox-triage-automation @ ${GITHUB_SHA}" \
            --parameters "{\"commands\":${COMMANDS_JSON}}" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Timed out waiting for deploy command to finish (last status: $STATUS)"
            exit 1
          fi

          echo "Deploy succeeded."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
