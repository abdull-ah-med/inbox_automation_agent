# Deploy runs from CI/CD (deploy-dev job on push to `dev`).
# This file is kept for manual re-deploys only.
name: Deploy Dev

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    name: Deploy to EC2 (via SSM)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command over SSM
        env:
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          {
            echo "export DEPLOY_SHA='${DEPLOY_SHA}'"
            echo "export BRANCH='dev'"
            echo "export GITHUB_TOKEN='${GITHUB_TOKEN}'"
            cat deploy/ssm-deploy.sh
          } > /tmp/ssm-deploy-pinned.sh

          COMMANDS_JSON=$(bash deploy/ssm-commands-json.sh /tmp/ssm-deploy-pinned.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy inbox-triage-automation @ ${DEPLOY_SHA}" \
            --parameters "{\"commands\":${COMMANDS_JSON}}" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Timed out waiting for deploy command to finish (last status: $STATUS)"
            exit 1
          fi

          echo "Deploy succeeded."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
