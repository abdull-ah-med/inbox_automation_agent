# Deploy runs from CI/CD (deploy-dev job on push to `dev`).
# Manual dispatch requires the same CI checks to have passed on the commit.
name: Deploy Dev

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    name: Deploy to EC2 (via SSM)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify CI checks passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/verify-ci-checks.sh "${{ github.sha }}" "${{ github.repository }}"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command over SSM
        env:
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
          BRANCH: dev
          GITHUB_TOKEN: ${{ github.token }}
        run: bash deploy/github-actions-ssm-deploy.sh
