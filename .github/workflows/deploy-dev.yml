# Deploy is intentionally separate from CI/CD.
#
# workflow_run always loads THIS file from the default branch (main), so a push
# to `dev` cannot weaken or remove the deploy gates/steps in the same commit
# that ships app code. CI still runs from the pushed commit; deploy only
# proceeds after that run succeeds, and only for push events on `dev`.
#
# Also configure GitHub Environment `dev` with required reviewers (Settings →
# Environments). The API call needs admin; write tokens cannot set reviewers.
name: Deploy Dev

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    name: Deploy to EC2 (via SSM)
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Verify required CI jobs succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Refuse deploy if the triggering CI run dropped Backend / Frontend /
          # Semgrep (a push that edits ci-cd.yml on `dev` could otherwise skip
          # gates while still reporting overall success).
          JOBS_JSON=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate)
          echo "$JOBS_JSON" | jq -e '
            (.jobs // []) as $jobs
            | ["Backend (lint + test)", "Frontend (lint + typecheck + test + build)", "Semgrep CE"] as $need
            | ($need | map(
                . as $n
                | ($jobs | map(select(.name == $n and .conclusion == "success")) | length) > 0
              ) | all)
          ' >/dev/null
          echo "Required CI jobs present and successful for run ${RUN_ID}."

      # Deploy verified CI SHA only on protected `dev` pushes; workflow edits in
      # the same commit are refused before any AWS/SSM steps run.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
        with:
          # Deploy the SHA CI actually verified, not this workflow's default-branch tip.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Refuse deploy when this push changed workflows
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Parent of the CI head commit. Multi-commit pushes that only change
          # app code still pass; any workflow edit in the tip commit blocks.
          if git rev-parse --verify "${DEPLOY_SHA}^" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "${DEPLOY_SHA}^" "${DEPLOY_SHA}" || true)
          else
            CHANGED=$(git show --pretty='' --name-only "${DEPLOY_SHA}" || true)
          fi
          if echo "${CHANGED}" | grep -E '^\.github/workflows/'; then
            echo "Refusing deploy: workflow files changed in ${DEPLOY_SHA}."
            echo "Merge workflow changes to main first (reviewed), then redeploy app-only commits."
            echo "Changed:"
            echo "${CHANGED}" | grep -E '^\.github/workflows/' || true
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command over SSM
        env:
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Pin EC2 checkout to the commit CI already verified.
          # https://docs.github.com/en/actions/learn-github-actions/variables
          {
            echo "export DEPLOY_SHA='${DEPLOY_SHA}'"
            echo "export BRANCH='dev'"
            cat deploy/ssm-deploy.sh
          } > /tmp/ssm-deploy-pinned.sh

          # One JSON string, not split("\n"): a line-split array would
          # execute the script's #!/bin/bash as its own RunShellScript command.
          COMMANDS_JSON=$(bash deploy/ssm-commands-json.sh /tmp/ssm-deploy-pinned.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy inbox-triage-automation @ ${DEPLOY_SHA}" \
            --parameters "{\"commands\":${COMMANDS_JSON}}" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Timed out waiting for deploy command to finish (last status: $STATUS)"
            exit 1
          fi

          echo "Deploy succeeded."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
